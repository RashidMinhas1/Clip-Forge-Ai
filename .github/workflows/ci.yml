name: MS-002 CI Validation

on:
  push:
    branches: [ "milestone/002-application-runtime-infrastructure" ]
  pull_request:
    branches: [ "milestone/002-application-runtime-infrastructure" ]

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Run Pytest
        run: |
          cd backend
          pytest

  frontend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: Install dependencies
        run: |
          cd frontend
          npm install
      - name: Run Build (Type Check & Lint)
        run: |
          cd frontend
          npm run build
